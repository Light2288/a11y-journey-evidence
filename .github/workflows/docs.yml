name: Documentation

on:
  pull_request:
    paths:
      - 'site/**'
      - 'examples/documentation/**'
      - 'tests/docs/**'
      - 'scripts/verify-docs-examples.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'examples/documentation/**'
      - 'tests/docs/**'
      - 'scripts/verify-docs-examples.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build and check documentation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@11.19.0
      - name: Install locked development dependencies
        run: npm ci
      - name: Install browser for documentation checks
        run: npx playwright install --with-deps chromium
      - name: Build and check the production site
        run: npm run docs:check
      - name: Upload the checked site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/.vitepress/dist

  deploy:
    name: Deploy documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy the checked artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
